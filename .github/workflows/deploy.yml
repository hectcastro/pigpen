name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run tests
        run: mise run test

  build:
    needs: test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Build static bundle
        run: mise run build

      - name: Upload website artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
